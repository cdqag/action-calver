---
name: 'CalVer Action'
description: 'Action that versions using CalVer'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub Token'
    required: true

  prerelease:
    description: 'Is the release a pre-release'
    default: 'false'

outputs:
  latest-release-tag:
    description: 'Latest release tag found in the repository'
    value: ${{ steps.latest.outputs.tag }}

  current-version:
    description: 'Current version'
    value: ${{ steps.latest.outputs.version }}

  new-version:
    description: 'New version'
    value: ${{ steps.new.outputs.version }}

  new-tag:
    description: 'New tag'
    value: ${{ steps.new.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Get latest release tag
      id: latest
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e
        set -o pipefail

        tag=$(gh release list -O desc -L 1 --json "tagName" | jq -r '.[0].tagName // "v0.0.0"')
        echo "Latest release tag: ${tag}"
        echo "tag=${tag}" >> $GITHUB_OUTPUT

        version="${tag:1}"
        echo "Latest version: ${version}"
        echo "version=${version}" >> $GITHUB_OUTPUT

    - name: Calculate new version
      id: new
      shell: bash
      env:
        CURRENT_VERSION: ${{ steps.latest.outputs.version }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -e

        NEW_DATE_PART=$(date '+%Y.%m')
        echo "New date part: ${NEW_DATE_PART}"

        echo "Decision making..."
        if case $CURRENT_VERSION in $NEW_DATE_PART*) ;; *) false;; esac ; then
          echo "Current version and new version part matches - Incrementing patch version.";
          version="${CURRENT_VERSION%.*}.$(( ${CURRENT_VERSION##*.} + 1 ))";
        else
          echo "Current version and new version does not match - Starting new version from patch 0"
          version="$NEW_DATE_PART.0";
        fi;

        if [ "${PRERELEASE}" = "true" ]; then \
          echo "Detected prelease flag enabled"
          version="${version}-pre-release"; \
        fi;

        echo "New version: ${version}"
        echo "version=${version}" >> $GITHUB_OUTPUT

        tag="v${version}"
        echo "New tag: ${tag}"
        echo "tag=${tag}" >> $GITHUB_OUTPUT
