---
name: 'Next CalVer'
description: 'Just create next CalVer version'

branding:
  icon: 'tag'
  color: 'blue'

inputs:
  date_format:
    description: 'Format date in posix shell (stftime)'
    default: '%Y.%m'

  prerelease:
    description: 'Is the release a pre-release'
    default: 'false'

outputs:
  last_version:
    description: 'Last version'
    value: ${{ steps.last_version.outputs.last_version }}

  next_version:
    description: 'Next version'
    value: ${{ steps.next_version.outputs.next_version }}

  next_tag:
    description: 'Next tag'
    value: ${{ steps.next_version.outputs.next_tag }}

runs:
  using: composite
  steps:
    - name: Get last version
      id: last_version
      shell: sh
      run: |
        LAST_VERSION=$(git tag --sort=-v:refname | grep -E "^v" | head -n 1)
        
        echo "Last version: ${LAST_VERSION}"
        echo "last_version=${LAST_VERSION}" >> $GITHUB_OUTPUT

    - name: Get next version
      id: next_version
      shell: sh
      env:
        LAST_VERSION: ${{ steps.last_version.outputs.last_version }}
        DATE_FORMAT: ${{ inputs.date_format }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        NEXT_DATE_PART="$(date "+${DATE_FORMAT}")"
        echo "Next date part: ${NEXT_DATE_PART}"

        if case $LAST_VERSION in $NEXT_DATE_PART*) ;; *) false;; esac ; then
          echo "Incrementing patch version.";
          NEXT_VERSION="${LAST_VERSION%.*}.$(( ${LAST_VERSION##*.} + 1 ))";
        else
          NEXT_VERSION="$NEXT_DATE_PART.0";
        fi;

        if [ "${PRERELEASE}" = "true" ]; then \
          NEXT_VERSION="${NEXT_VERSION}-pre-release"; \
        fi;

        echo "Next version: ${NEXT_VERSION}"
        echo "next_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT

        NEXT_TAG="v${NEXT_VERSION}"
        echo "Next tag: ${NEXT_TAG}"
        echo "next_tag=${NEXT_TAG}" >> $GITHUB_OUTPUT
